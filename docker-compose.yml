# Gestionale Tazze: database + applicazione.
#   docker compose up -d --build                  avvia tutto (app su http://localhost:8080)
#   docker compose --profile tools up -d          aggiunge pgAdmin su http://localhost:5050
#   docker compose down                           ferma tutto (i dati restano nel volume)
# Progetto separato dalla versione carte: container, rete e volume propri.
name: compravendita-sw-tazze

services:
  postgres:
    image: postgres:16
    container_name: compravendita-sw-tazze-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-compravendita}
      POSTGRES_USER: ${DB_USER:-compravendita}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-compravendita}
      TZ: Europe/Rome
    ports:
      - "${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-compravendita} -d ${DB_NAME:-compravendita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applicazione (immagine costruita dal Dockerfile)
  app:
    build: .
    image: compravendita-sw-tazze
    container_name: compravendita-sw-tazze-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-compravendita}
      DB_USER: ${DB_USER:-compravendita}
      DB_PASSWORD: ${DB_PASSWORD:-compravendita}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # foto degli articoli: stessa cartella usata in sviluppo e dagli script di backup
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Interfaccia web per ispezionare il DB (facoltativa)
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: compravendita-sw-tazze-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

volumes:
  pgdata:
