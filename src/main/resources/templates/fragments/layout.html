<!DOCTYPE html>
<!--/* Layout comune: le pagine lo usano con th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}" */-->
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:replace="${title}">Gestionale</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body th:attr="hx-headers=|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|">
<div class="d-flex app-shell">
    <nav class="sidebar d-flex flex-column flex-shrink-0 p-3 text-bg-dark">
        <a th:href="@{/dashboard}" class="d-flex align-items-center mb-3 text-white text-decoration-none">
            <i class="bi bi-box-seam fs-4 me-2"></i>
            <span class="fs-5 fw-semibold">Compravendita</span>
        </a>
        <form th:action="@{/cerca}" method="get" role="search" class="mb-2">
            <input type="search" name="q" class="form-control form-control-sm" placeholder="Cerca ovunque…"
                   aria-label="Cerca articoli, acquisti e vendite" th:value="${activePage == 'cerca'} ? ${q} : ''">
        </form>
        <hr class="mt-1">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/dashboard}" class="nav-link text-white"
                   th:classappend="${activePage == 'dashboard'} ? 'active'">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/articoli}" class="nav-link text-white"
                   th:classappend="${activePage == 'articoli'} ? 'active'">
                    <i class="bi bi-collection me-2"></i>Catalogo</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/brand}" class="nav-link text-white"
                   th:classappend="${activePage == 'brand'} ? 'active'">
                    <i class="bi bi-tags me-2"></i>Brand</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/acquisti}" class="nav-link text-white"
                   th:classappend="${activePage == 'acquisti'} ? 'active'">
                    <i class="bi bi-cart-plus me-2"></i>Acquisti</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/magazzino}" class="nav-link text-white"
                   th:classappend="${activePage == 'magazzino'} ? 'active'">
                    <i class="bi bi-boxes me-2"></i>Magazzino</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/vendite}" class="nav-link text-white"
                   th:classappend="${activePage == 'vendite'} ? 'active'">
                    <i class="bi bi-cash-coin me-2"></i>Vendite</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/piattaforme}" class="nav-link text-white"
                   th:classappend="${activePage == 'piattaforme'} ? 'active'">
                    <i class="bi bi-shop me-2"></i>Piattaforme</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/report}" class="nav-link text-white"
                   th:classappend="${activePage == 'report'} ? 'active'">
                    <i class="bi bi-graph-up-arrow me-2"></i>Report</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/import}" class="nav-link text-white"
                   th:classappend="${activePage == 'import'} ? 'active'">
                    <i class="bi bi-upload me-2"></i>Importa</a>
            </li>
        </ul>
        <hr>
        <div class="d-flex align-items-center justify-content-between">
            <span class="small"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name">utente</span></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-light" title="Esci"><i class="bi bi-box-arrow-right"></i></button>
            </form>
        </div>
    </nav>

    <div class="flex-grow-1 p-4 bg-body-tertiary content-area">
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${messaggio}">
            <i class="bi bi-check-circle me-1"></i><span th:text="${messaggio}">Operazione completata</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errore}">
            <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errore}">Errore</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
        </div>
        <main th:replace="${content}">
        </main>
    </div>
</div>
<div id="avvisi-errore" class="avvisi-errore" aria-live="assertive"></div>

<script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<script th:src="@{/webjars/chart.js/dist/chart.umd.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
