<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Dashboard · Compravendita</title>
</head>
<body>
<main class="flex-grow-1 p-4 bg-body-tertiary">
    <h1 class="h3 mb-4">Dashboard</h1>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3" th:each="kpi : ${ {'Fatturato', 'Netto', 'Profitto', 'ROI medio'} }">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="text-secondary small" th:text="${kpi}">KPI</div>
                    <div class="fs-4 fw-semibold">—</div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-info">
        <i class="bi bi-info-circle me-1"></i>
        I KPI, i grafici e gli hot items arriveranno nella Fase 6. Per ora la dashboard è solo un segnaposto.
    </div>
</main>
</body>
</html>
