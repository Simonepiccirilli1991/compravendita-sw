<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Schede di navigazione della sezione magazzino */-->
<ul th:fragment="schede(sezione)" class="nav nav-tabs mb-3">
    <li class="nav-item">
        <a class="nav-link" th:href="@{/magazzino}" th:classappend="${sezione == 'giacenze'} ? 'active'">
            <i class="bi bi-boxes me-1"></i>Giacenze</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/magazzino/lotti}" th:classappend="${sezione == 'lotti'} ? 'active'">
            <i class="bi bi-stack me-1"></i>Lotti</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/magazzino/grading}" th:classappend="${sezione == 'grading'} ? 'active'">
            <i class="bi bi-award me-1"></i>Grading</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/magazzino/rettifiche}" th:classappend="${sezione == 'rettifiche'} ? 'active'">
            <i class="bi bi-clipboard-minus me-1"></i>Rettifiche</a>
    </li>
</ul>

<!--/* Badge con lo stato di un lotto */-->
<span th:fragment="stato(stato)" class="badge" th:classappend="${stato.classeBadge}" th:text="${stato.etichetta}">Stato</span>

<!--/* Menu azioni di un lotto: cambi di stato, rettifica, grading. ritorno = pagina a cui tornare */-->
<th:block th:fragment="azioniLotto(lotto, ritorno)"
          th:with="transizioni=${lotto.stato.transizioniManuali()}, rettificabile=${lotto.quantitaResidua > 0 and lotto.stato.name() != 'IN_GRADING'}, gradabile=${@gradingService.puoInviare(lotto)}, vendibile=${lotto.quantitaResidua > 0 and lotto.stato.name() != 'IN_GRADING'}">
<div class="dropdown" th:if="${!#lists.isEmpty(transizioni) or rettificabile or gradabile or vendibile}">
    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
            data-bs-popper-config='{"strategy":"fixed"}' aria-expanded="false">Azioni</button>
    <ul class="dropdown-menu dropdown-menu-end">
        <li th:each="s : ${transizioni}">
            <form th:action="@{/magazzino/lotti/{id}/stato(id=${lotto.id})}" method="post">
                <input type="hidden" name="stato" th:value="${s}">
                <input type="hidden" name="ritorno" th:value="${ritorno}">
                <button type="submit" class="dropdown-item">
                    <i class="bi bi-arrow-right-circle me-1"></i><span th:text="|Segna: ${s.etichetta}|">Segna</span>
                </button>
            </form>
        </li>
        <li th:if="${vendibile}">
            <a class="dropdown-item" th:href="@{/vendite/nuova(lottoId=${lotto.id})}">
                <i class="bi bi-cash-coin me-1"></i>Vendi da questo lotto</a>
        </li>
        <li th:if="${gradabile}">
            <a class="dropdown-item" th:href="@{/magazzino/lotti/{id}/grading(id=${lotto.id})}">
                <i class="bi bi-award me-1"></i>Invia a grading</a>
        </li>
        <li th:if="${rettificabile}">
            <a class="dropdown-item" th:href="@{/magazzino/lotti/{id}/rettifica(id=${lotto.id})}">
                <i class="bi bi-clipboard-minus me-1"></i>Rettifica (perso, danneggiato…)</a>
        </li>
    </ul>
</div>
</th:block>

</body>
</html>
