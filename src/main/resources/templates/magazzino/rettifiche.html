<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Rettifiche · Magazzino · Compravendita</title>
</head>
<body>
<main>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Magazzino</h1>
    </div>
    <ul th:replace="~{magazzino/fragments :: schede(${sezione})}"></ul>

    <p class="small text-secondary">
        Pezzi usciti dal magazzino senza vendita. Per registrare una rettifica apri il menu <em>Azioni</em> di un lotto.
    </p>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Data</th>
                    <th>Articolo</th>
                    <th>Motivo</th>
                    <th class="text-end">Pezzi</th>
                    <th class="text-end">Valore a costo</th>
                    <th class="text-end">Recuperato</th>
                    <th class="text-end">Perdita</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${pagina.content}">
                    <td th:text="${@formati.data(r.dataRettifica)}">01/01/2026</td>
                    <td>
                        <a th:href="@{/articoli/{id}(id=${r.rigaAcquisto.articolo.id})}" class="text-decoration-none"
                           th:text="${r.rigaAcquisto.articolo.nome}">Articolo</a>
                        <div class="small text-secondary">
                            Lotto del <a th:href="@{/acquisti/{id}(id=${r.rigaAcquisto.acquisto.id})}"
                                         th:text="${@formati.data(r.rigaAcquisto.acquisto.dataAcquisto)}">01/01/2026</a>
                        </div>
                        <div class="small text-secondary fst-italic" th:if="${r.note}" th:text="${r.note}"></div>
                    </td>
                    <td th:text="${r.motivo.etichetta}">Motivo</td>
                    <td class="text-end" th:text="${r.quantita}">1</td>
                    <td class="text-end" th:text="${@formati.euro(r.valore)}">0</td>
                    <td class="text-end" th:text="${@formati.euro(r.importoRecuperato)}">0</td>
                    <td class="text-end fw-semibold text-danger" th:text="${@formati.euro(r.perdita)}">0</td>
                    <td class="text-end">
                        <form th:action="@{/magazzino/rettifiche/{id}/annulla(id=${r.id})}" method="post"
                              onsubmit="return confirm('Annullare la rettifica e rimettere i pezzi nel lotto?');">
                            <button type="submit" class="btn btn-sm btn-outline-secondary" title="Annulla rettifica">
                                <i class="bi bi-arrow-counterclockwise"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pagina.empty}">
                    <td colspan="8" class="text-center text-secondary py-4">Nessuna rettifica registrata.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${pagina.totalPages > 1}" aria-label="Paginazione">
        <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                th:classappend="${i == pagina.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}" th:href="@{/magazzino/rettifiche(page=${i})}">1</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
