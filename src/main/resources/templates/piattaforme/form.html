<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${piattaforma} ? 'Modifica piattaforma · Gestionale Tazze' : 'Nuova piattaforma · Gestionale Tazze'">Piattaforma</title>
</head>
<body>
<main>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/piattaforme}">Piattaforme</a></li>
            <li class="breadcrumb-item active" th:text="${piattaforma} ? ${piattaforma.nome} : 'Nuova'">Nuova</li>
        </ol>
    </nav>
    <h1 class="h3 mb-3" th:text="${piattaforma} ? 'Modifica piattaforma' : 'Nuova piattaforma'">Nuova piattaforma</h1>

    <form th:action="${piattaforma} ? @{/piattaforme/{id}(id=${piattaforma.id})} : @{/piattaforme}" th:object="${form}"
          method="post" class="card shadow-sm" novalidate>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-12 col-md-8">
                    <label for="nome" class="form-label">Nome *</label>
                    <input type="text" th:field="*{nome}" class="form-control" maxlength="100"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>
                <div class="col-12 col-md-4 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input type="checkbox" th:field="*{attiva}" class="form-check-input">
                        <label class="form-check-label" for="attiva1">Attiva (selezionabile nelle vendite)</label>
                    </div>
                </div>

                <div class="col-12"><h2 class="h6 text-secondary text-uppercase mb-0">Commissione della piattaforma</h2></div>
                <div class="col-6 col-md-3">
                    <label for="feePercentuale" class="form-label">Percentuale</label>
                    <div class="input-group">
                        <input type="number" step="0.01" min="0" max="100" th:field="*{feePercentuale}" class="form-control"
                               th:classappend="${#fields.hasErrors('feePercentuale')} ? 'is-invalid'">
                        <span class="input-group-text">%</span>
                        <div class="invalid-feedback" th:errors="*{feePercentuale}"></div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <label for="feeFissa" class="form-label">Fissa per ordine</label>
                    <div class="input-group">
                        <span class="input-group-text">€</span>
                        <input type="number" step="0.01" min="0" th:field="*{feeFissa}" class="form-control"
                               th:classappend="${#fields.hasErrors('feeFissa')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{feeFissa}"></div>
                    </div>
                </div>

                <div class="col-12"><h2 class="h6 text-secondary text-uppercase mb-0">Commissione di pagamento</h2></div>
                <div class="col-6 col-md-3">
                    <label for="feePagamentoPercentuale" class="form-label">Percentuale</label>
                    <div class="input-group">
                        <input type="number" step="0.01" min="0" max="100" th:field="*{feePagamentoPercentuale}" class="form-control"
                               th:classappend="${#fields.hasErrors('feePagamentoPercentuale')} ? 'is-invalid'">
                        <span class="input-group-text">%</span>
                        <div class="invalid-feedback" th:errors="*{feePagamentoPercentuale}"></div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <label for="feePagamentoFissa" class="form-label">Fissa per ordine</label>
                    <div class="input-group">
                        <span class="input-group-text">€</span>
                        <input type="number" step="0.01" min="0" th:field="*{feePagamentoFissa}" class="form-control"
                               th:classappend="${#fields.hasErrors('feePagamentoFissa')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{feePagamentoFissa}"></div>
                    </div>
                </div>
                <div class="col-12 col-md-6 small text-secondary align-self-end">
                    Es. PayPal per vendite tra privati, o la quota del pagamento integrato se la piattaforma la separa.
                    Lascia 0 se è già compresa nella commissione della piattaforma.
                </div>

                <div class="col-12">
                    <label for="note" class="form-label">Note</label>
                    <textarea th:field="*{note}" class="form-control" rows="2"
                              placeholder="Es. tariffe aggiornate a ottobre 2026, categoria casa e cucina"></textarea>
                </div>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-end gap-2">
            <a th:href="@{/piattaforme}" class="btn btn-outline-secondary">Annulla</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salva</button>
        </div>
    </form>
</main>
</body>
</html>
