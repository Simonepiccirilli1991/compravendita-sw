<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Acquisti · Gestionale Tazze</title>
</head>
<body>
<main>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Acquisti</h1>
        <a th:href="@{/acquisti/nuovo}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nuovo acquisto</a>
    </div>

    <form class="card card-body shadow-sm mb-3" th:action="@{/acquisti}" method="get"
          th:attr="hx-get=@{/acquisti}" hx-target="#risultati" hx-swap="outerHTML"
          hx-push-url="true" hx-trigger="input changed delay:300ms from:input[name='q'], change">
        <div class="row g-2">
            <div class="col-12 col-md-6">
                <input type="search" name="q" class="form-control" placeholder="Fornitore, canale o articolo…"
                       th:value="${filtro.q}" aria-label="Cerca">
            </div>
            <div class="col-6 col-md-3">
                <div class="input-group">
                    <span class="input-group-text">Dal</span>
                    <input type="date" name="da" class="form-control" th:value="${filtro.da}" aria-label="Dal">
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="input-group">
                    <span class="input-group-text">Al</span>
                    <input type="date" name="a" class="form-control" th:value="${filtro.a}" aria-label="Al">
                </div>
            </div>
        </div>
        <noscript><button type="submit" class="btn btn-secondary mt-2">Filtra</button></noscript>
    </form>

    <div id="risultati" th:fragment="risultati">
        <div class="d-flex justify-content-end gap-2 mb-2">
            <a th:href="@{/export/acquisti.xlsx(q=${filtro.q},da=${filtro.da},a=${filtro.a})}" class="btn btn-sm btn-outline-success"><i class="bi bi-file-earmark-excel me-1"></i>Excel</a>
            <a th:href="@{/export/acquisti.csv(q=${filtro.q},da=${filtro.da},a=${filtro.a})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-filetype-csv me-1"></i>CSV</a>
        </div>
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Data</th>
                        <th>Articoli</th>
                        <th>Fornitore</th>
                        <th>Canale</th>
                        <th class="text-end">Righe</th>
                        <th class="text-end">Pezzi</th>
                        <th class="text-end">Costi accessori</th>
                        <th class="text-end">Totale</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${pagina.content}">
                        <td><a th:href="@{/acquisti/{id}(id=${a.id})}" class="fw-semibold text-decoration-none"
                               th:text="${@formati.data(a.dataAcquisto)}">01/01/2026</a></td>
                        <td>
                            <div th:each="r, it : ${a.righe}" th:if="${it.index < 3}" class="text-truncate" style="max-width: 22rem">
                                <a th:href="@{/articoli/{id}(id=${r.articolo.id})}" class="text-decoration-none"
                                   th:text="${r.articolo.nome}" th:title="${r.articolo.nome}">Articolo</a>
                                <span class="text-secondary small" th:if="${r.quantita > 1}" th:text="|× ${r.quantita}|">× 2</span>
                            </div>
                            <div th:if="${a.righe.size() > 3}" class="small text-secondary"
                                 th:text="|e altri ${a.righe.size() - 3}…|">e altri 2…</div>
                        </td>
                        <td th:text="${a.fornitore} ?: '—'">Fornitore</td>
                        <td th:text="${a.canale} ?: '—'">Canale</td>
                        <td class="text-end" th:text="${a.righe.size()}">1</td>
                        <td class="text-end" th:text="${a.totalePezzi}">1</td>
                        <td class="text-end" th:text="${@formati.euro(a.totaleCostiAccessori)}">0</td>
                        <td class="text-end fw-semibold" th:text="${@formati.euro(a.totale)}">0</td>
                    </tr>
                    <tr th:if="${pagina.empty}">
                        <td colspan="8" class="text-center text-secondary py-4">Nessun acquisto trovato.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2" th:if="${pagina.totalElements > 0}">
            <span class="small text-secondary"
                  th:text="|${pagina.totalElements} acquisti · pagina ${pagina.number + 1} di ${pagina.totalPages}|"></span>
            <nav th:if="${pagina.totalPages > 1}" aria-label="Paginazione">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/acquisti(q=${filtro.q},da=${filtro.da},a=${filtro.a},page=${pagina.number - 1})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                        th:classappend="${i == pagina.number} ? 'active'">
                        <a class="page-link" th:text="${i + 1}"
                           th:href="@{/acquisti(q=${filtro.q},da=${filtro.da},a=${filtro.a},page=${i})}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/acquisti(q=${filtro.q},da=${filtro.da},a=${filtro.a},page=${pagina.number + 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>
</body>
</html>
