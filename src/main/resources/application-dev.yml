# Profilo di sviluppo: avvia/riusa automaticamente il PostgreSQL di docker-compose.dev.yml (solo database)
spring:
  docker:
    compose:
      enabled: true
      file: docker-compose.dev.yml
      lifecycle-management: start-only
  thymeleaf:
    cache: false
  jpa:
    show-sql: false

logging:
  level:
    it.compravendita: DEBUG
